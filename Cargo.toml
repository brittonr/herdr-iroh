[package]
name = "herdr-iroh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Relay a local herdr socket API over iroh, and drive it from a stdio MCP server"
publish = false
repository = "https://github.com/brittonr/herdr-iroh"
readme = "README.md"

[[bin]]
name = "herdr-iroh"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = "1.4.1"
iroh-tickets = "1.0.0"
rmcp = { version = "3.8.0", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
rmcp = { version = "3.8.0", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
